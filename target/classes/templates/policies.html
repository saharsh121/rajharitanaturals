<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store policies · Rajharita Naturals</title>
    <link rel="stylesheet" th:href="@{/css/shop.css(v=20261023)}" />
    <link rel="stylesheet" th:href="@{/css/coupon-showcase.css(v=20261028)}" />
</head>
<body>
    <header class="customer-header">
        <a class="customer-brand" th:href="@{/}">Rajharita Naturals</a>
        <nav class="customer-nav" aria-label="Customer navigation">
            <a th:href="@{/shop}">Shop</a>
            <a th:href="@{/contact}">Contact</a>
            <a th:href="@{/policies}" aria-current="page">Policies</a>
        </nav>
        <a class="account-link" th:href="@{/account}">My account</a>
    </header>
    <div th:replace="~{fragments/coupon-showcase :: coupon-showcase}"></div>
    <main>
        <section class="intro"><p class="eyebrow">INFORMATION</p><h1>Store policies</h1></section>
        <section class="policy-card"><h2>Terms and conditions</h2><p id="terms">Loading…</p></section>
        <section class="policy-card"><h2>Privacy policy</h2><p id="privacy">Loading…</p></section>
        <section class="policy-card"><h2>Returns and refunds</h2><p id="returns">Loading…</p></section>
    </main>
    <script th:src="@{/js/coupon-showcase.js(v=20261028)}"></script>
    <script th:src="@{/js/policies.js}"></script>
</body>
</html>

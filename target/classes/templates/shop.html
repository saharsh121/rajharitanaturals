<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop · Rajharita Naturals</title>
    <link rel="stylesheet" th:href="@{/css/shop.css(v=20261031)}" />
    <link rel="stylesheet" th:href="@{/css/coupon-showcase.css(v=20261028)}" />
</head>
<body>
    <header class="customer-header">
        <a class="customer-brand" href="/shop">Rajharita Naturals</a>
        <nav class="customer-nav" aria-label="Customer navigation">
            <a class="active" href="/shop" aria-current="page">Shop</a>
            <a href="/cart">Cart <span id="cart-count"></span></a>
            <a href="/orders">My orders</a>
        </nav>
        <a class="account-link" href="/account">My account</a>
    </header>
    <div th:replace="~{fragments/coupon-showcase :: coupon-showcase}"></div>
    <main>
        <section class="intro"><p class="eyebrow">NATURAL WELLNESS</p><h1>Shop our collection</h1><p>Carefully selected natural products for everyday wellness.</p></section>
        <aside id="coin-wallet" class="coin-wallet" hidden aria-live="polite"><span class="coin-mark" aria-hidden="true">🪙</span><span><strong>Rajharita Coins</strong><small><span id="shop-coin-balance">0</span> coins available · 1 coin = ₹1</small></span></aside>
        <section class="filters">
            <input id="search" placeholder="Search products" aria-label="Search products" />
            <select id="category"><option value="">All categories</option></select>
            <input id="brand" placeholder="Brand" aria-label="Brand" />
            <input id="min-price" type="number" min="0" placeholder="Min price" aria-label="Minimum price" />
            <input id="max-price" type="number" min="0" placeholder="Max price" aria-label="Maximum price" />
            <select id="availability"><option value="">All availability</option><option value="true">In stock</option><option value="false">Out of stock</option></select>
            <select id="sort"><option value="newest">Newest</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="popular">Popularity</option></select>
            <button id="search-button">Search</button>
        </section>
        <p id="message-box" role="status" aria-live="polite"></p>
        <section id="products" class="products"></section>
    </main>
    <dialog id="product-detail-dialog" class="product-detail-dialog" aria-label="Product details">
        <button type="button" class="product-detail-close" id="close-product-details" aria-label="Close product details">×</button>
        <div id="product-detail-content"></div>
    </dialog>
    <script th:src="@{/js/coupon-showcase.js(v=20261028)}"></script>
    <script th:src="@{/js/shop.js(v=20261027-2245)}"></script>
</body>
</html>

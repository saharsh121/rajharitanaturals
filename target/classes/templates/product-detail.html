<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product · Rajharita Naturals</title>
    <link rel="stylesheet" th:href="@{/css/shop.css(v=20261023)}" />
    <link rel="stylesheet" th:href="@{/css/coupon-showcase.css(v=20261028)}" />
</head>
<body>
    <header class="customer-header">
        <a class="customer-brand" href="/">Rajharita Naturals</a>
        <nav class="customer-nav" aria-label="Customer navigation">
            <a href="/shop" aria-current="page">Shop</a>
            <a href="/cart">Cart</a>
            <a href="/orders">My orders</a>
        </nav>
        <a class="account-link" href="/account">My account</a>
    </header>
    <div th:replace="~{fragments/coupon-showcase :: coupon-showcase}"></div>
    <main id="product-detail">
        <p id="message-box" role="status" aria-live="polite"></p>
        <div class="empty">Loading product details…</div>
    </main>
    <script th:src="@{/js/coupon-showcase.js(v=20261028)}"></script>
    <script th:src="@{/js/product-detail.js}"></script>
</body>
</html>

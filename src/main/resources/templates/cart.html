<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart · Rajharita Naturals</title>
    <link rel="stylesheet" th:href="@{/css/shop.css(v=20261031)}" />
    <link rel="stylesheet" th:href="@{/css/coupon-showcase.css(v=20261028)}" />
</head>
<body>
    <header class="customer-header">
        <a class="customer-brand" href="/shop">Rajharita Naturals</a>
        <nav class="customer-nav" aria-label="Customer navigation">
            <a href="/shop">Shop</a>
            <a class="active" href="/cart" aria-current="page">Cart</a>
            <a href="/orders">My orders</a>
        </nav>
        <a class="account-link" href="/account">My account</a>
    </header>
    <div th:replace="~{fragments/coupon-showcase :: coupon-showcase}"></div>
    <main>
        <section class="intro"><p class="eyebrow">YOUR SELECTION</p><h1>Shopping cart</h1><p>Review your items before checkout.</p></section>
        <aside id="coin-wallet" class="coin-wallet" hidden aria-live="polite"><span class="coin-mark" aria-hidden="true">🪙</span><span><strong>Rajharita Coins</strong><small><span id="cart-coin-balance">0</span> coins available · 1 coin = ₹1</small></span></aside>
        <p id="message-box" role="status" aria-live="polite"></p>
        <section class="cart-layout">
            <div id="cart-items" class="cart-items"></div>
            <aside class="summary"><h2>Order summary</h2><p>Subtotal <strong id="subtotal">₹0.00</strong></p><p>Delivery calculated at checkout</p><button id="checkout-button">Proceed to checkout</button></aside>
        </section>
        <section class="wishlist-section"><h2>Wishlist</h2><div id="wishlist-items" class="products"></div></section>
    </main>
    <script th:src="@{/js/coupon-showcase.js(v=20261028)}"></script>
    <script th:src="@{/js/cart.js(v=20261031)}"></script>
</body>
</html>

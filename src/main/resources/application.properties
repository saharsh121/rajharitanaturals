# ================================
# SERVER
# ================================
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ================================
# APPLICATION
# ================================
spring.application.name=rajharita

# Set to true to require invitations or addresses in the approved-email list
app.auth.require-invitation=false
app.auth.approved-emails=
# Set to true to hold verified registrations for administrator approval
app.auth.require-admin-approval=false
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.online-enabled=false
app.orders.payment-timeout-scan-ms=60000

# ================================
# MONGODB (local)
# ================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false

# ================================
# THYMELEAF
# ================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ================================
# STATIC RESOURCES
# ================================
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.web.resources.static-locations=classpath:/static/,file:${app.upload.dir}/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ================================
# EMAIL (Gmail SMTP)
# ================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rajharitanaturals@gmail.com
spring.mail.password=iacqffaadhdnjqta
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ================================
# JSON
# ================================
spring.jackson.serialization.indent-output=true

# ================================
# LOGGING
# ================================
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.thymeleaf=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=INFO







